	<h1><u>Contact Page</u></h1>
	<form action="#" method="post">
  <label for="fname">First name</label>
  <input type="text" id="fname" name="fname" required>

  <label for="lname">Last name</label>
  <input type="text" id="lname" name="lname" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>



  <label for="topic">Topic of interest</label>
  <select id="topic" name="topic">
    <option value="">Select a topic…</option>
    <option>Dark matter basics</option>
    <option>Galaxy rotation curves</option>
    <option>Gravitational lensing</option>
    <option>WIMPs &amp; particle candidates</option>
    <option>Axions</option>
    <option>Direct detection experiments</option>
    <option>Cosmic microwave background</option>
    <option>Dark energy</option>
    <option>Other</option>
  </select>

  <label for="level">Your background</label>
  <select id="level" name="level">
    <option value="">Select one…</option>
    <option>Curious beginner</option>
    <option>Student</option>
    <option>Educator</option>
    <option>Amateur astronomer</option>
    <option>Professional researcher</option>
  </select>

  <label for="subject">Subject</label>
  <input type="text" id="subject" name="subject">

  <label for="message">Message</label>
  <textarea id="message" name="message" placeholder="Write message here."></textarea>

  <div class="check">
    <input type="checkbox" id="newsletter" name="newsletter">
    <label for="newsletter">Send me news about new dark matter discoveries</label>
  </div>

  <button type="submit">Send</button>
</form>

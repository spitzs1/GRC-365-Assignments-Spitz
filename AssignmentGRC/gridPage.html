	.gridlayout {
		display: grid;
		grid-template-columns: 1fr 1fr;

		max-width: 600px;
		height: 600px;                    
		padding: 20px;
		margin: 0 auto;
	}

	.gridlayout img {
	  width: 100%;
	  height: 100%;
	  object-fit: cover;   
	  display: block;
	}

	.gridlayout .tall {
	  grid-column: 2;      
	  grid-row: 1 / span 3; 
	}
